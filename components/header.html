<div aria-labelledby="rdFavoritesPopupTitle" aria-modal="true" class="rd-fav-popup" role="dialog">
<div class="rd-fav-popup-head">
<div class="rd-fav-popup-title" id="rdFavoritesPopupTitle">

<script>
(function(){
function init(){
var root=document.getElementById('red-dragon-header');
if(!root||root.dataset.ready==='1')return;
root.dataset.ready='1';
var API_BASE='https://red-dragon-api.red-dragon-minsk.workers.dev/api',
favoriteKey='rd-favorites',
favoriteCache={},
favoriteLoadSeq=0;
function readTheme(){
try{
var s=localStorage.getItem('theme-storage'),
o=s&&JSON.parse(s);
return o&&o.state&&o.state.theme==='dark'?'dark':'light'
}catch(e){return'light'}
}
function saveTheme(t){
try{
localStorage.setItem('theme-storage',JSON.stringify({state:{theme:t},version:0}))
}catch(e){}
}
function applyTheme(t){
t=t==='dark'?'dark':'light';
var h=document.documentElement;
h.setAttribute('data-theme',t);
h.classList.remove('light','dark','rd-dark');
h.classList.add(t);
if(t==='dark')h.classList.add('rd-dark');
h.style.colorScheme=t;
root.classList.toggle('dark',t==='dark');
var l=root.querySelector('#cvLight'),
d=root.querySelector('#cvDark'),
m=root.querySelector('#cvMobileTheme');
if(l)l.classList.toggle('sel',t==='light');
if(d)d.classList.toggle('sel',t==='dark');
if(m)m.classList.toggle('dark',t==='dark')
}
applyTheme(readTheme());
var light=root.querySelector('#cvLight'),
dark=root.querySelector('#cvDark'),
mt=root.querySelector('#cvMobileTheme');
if(light)light.addEventListener('click',function(){
applyTheme('light');
saveTheme('light')
});
if(dark)dark.addEventListener('click',function(){
applyTheme('dark');
saveTheme('dark')
});
if(mt)mt.addEventListener('click',function(){
var t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
applyTheme(t);
saveTheme(t)
});
function normalize(u){
try{
var x=new URL(u,window.location.origin);
return x.origin+x.pathname.replace(/\/+$/,'')
}catch(e){
return u.replace(/\/+$/,'')
}
}
function markActive(){
var here=normalize(location.href);
root.querySelectorAll('.cv-nav a,.cv-menu-link').forEach(function(a){
a.classList.remove('active');
a.removeAttribute('aria-current');
var h=a.getAttribute('href');
if(!h||h.charAt(0)==='#')return;
try{
if(normalize(h)===here){
a.classList.add('active');
a.setAttribute('aria-current','page')
}
}catch(e){}
})
}
markActive();
var burger=root.querySelector('#cvBurger'),
menu=root.querySelector('#cvMenu'),
closeBtn=menu&&menu.querySelector('.cv-menu-close');
function closeMenu(){
if(burger)burger.classList.remove('open');
if(menu)menu.classList.remove('open');
if(!document.getElementById('rdFavoritesPopup')?.classList.contains('open'))
document.documentElement.style.overflow=''
}
function openMenu(){
if(burger)burger.classList.add('open');
if(menu)menu.classList.add('open');
document.documentElement.style.overflow='hidden'
}
if(burger&&menu)
burger.addEventListener('click',function(){
menu.classList.contains('open')?closeMenu():openMenu()
});
if(closeBtn)closeBtn.addEventListener('click',closeMenu);
if(menu)
menu.querySelectorAll('.cv-menu-link,.cv-menu-phone a').forEach(function(a){
a.addEventListener('click',function(){
closeMenu();
markActive()
})
});
function esc(v){
return String(v==null?'':v).replace(/[&<>"']/g,function(c){
return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
})
}
function num(v){
if(v==null||v==='')return'';
var n=Number(v);
return Number.isFinite(n)?n.toLocaleString('ru-RU'):String(v)
}
function money(v){
if(v==null||v==='')return'—';
var n=Number(v);
return Number.isFinite(n)?'$ '+n.toLocaleString('ru-RU'):String(v)
}
function getFavs(){
try{
var a=JSON.parse(localStorage.getItem(favoriteKey)||'[]');
return Array.isArray(a)?a.map(String):[]
}catch(e){
return[]
}
}
function setFavs(a){
a=(Array.isArray(a)?a:[]).map(String);
var u=[];
a.forEach(function(id){
if(u.indexOf(id)<0)u.push(id)
});
try{
localStorage.setItem(favoriteKey,JSON.stringify(u))
}catch(e){}
window.dispatchEvent(new CustomEvent('red-dragon:favorites-changed',{
detail:{favorites:u.slice(),count:u.length}
}));
return u
}
function isFav(id){
return getFavs().indexOf(String(id))>=0
}
function removeFav(id){
id=String(id);
var a=getFavs(),
i=a.indexOf(id);
if(i>=0)a.splice(i,1);
setFavs(a);
return i>=0
}
function syncFavoriteButton(){
var b=root.querySelector('#cvFavorites'),
c=root.querySelector('#cvFavoritesCount'),
n=getFavs().length,
o=document.getElementById('rdFavoritesPopup')?.classList.contains('open');
if(!b)return;
b.classList.toggle('active',n>0);
b.setAttribute('aria-label',n?'Избранное: '+n:'Избранное');
b.setAttribute('aria-expanded',o?'true':'false');
if(c){
c.textContent=n>99?'99+':String(n);
c.classList.toggle('show',n>0)
}
}
function api(path){
return API_BASE.replace(/\/$/,'')+path
}
async function getListing(id){
id=String(id);
if(favoriteCache[id])
return favoriteCache[id];
var r=await fetch(
api('/listings/'+encodeURIComponent(id)),
{
headers:{
Accept:'application/json'
}
}
);
var d=await r.json().catch(function(){
return{}
});
if(!r.ok){
throw new Error(
(d.code?d.code+' — ':'')+
(d.detail||d.message||d.title||('HTTP '+r.status))
)
}
var c=d.listing||d.item||d.data||d;
if(c&&typeof c==='object'){
favoriteCache[id]=c
}
return c
}
function title(c){
return c&&(
c.title||
c.name||
[
c.brand&&c.brand.name,
c.model&&c.model.name,
c.year
].filter(Boolean).join(' ')||
'Автомобиль'
)
}
function image(c){
if(!c)return'';
if(c.cover&&c.cover.url)
return c.cover.url;
if(Array.isArray(c.photos))
for(var i=0;i<c.photos.length;i++)
if(c.photos[i]&&c.photos[i].url)
return c.photos[i].url;
return''
}
function meta(c){
var a=[];
if(c&&c.year)
a.push(c.year+' г.');
if(c&&c.mileage!=null)
a.push(num(c.mileage)+' км.');
if(c&&c.city)
a.push(c.city);
return a.join(' · ')
}
function price(c){
if(!c)return'';
var p=c.sourcePrice;
if(p&&p.usd!=null)
return money(p.usd);
if(c.price&&typeof c.price==='object'&&c.price.usd!=null)
return money(c.price.usd);
if(c.price!=null&&c.price!=='')
return money(c.price);
return''
}
function item(c){
var id=String(c&&c.id||''),
im=image(c),
t=title(c),
m=meta(c),
p=price(c);
return'<div class="rd-fav-item" data-favorite-id="'+esc(id)+'">'+
'<a class="rd-fav-item-link" href="/car?id='+encodeURIComponent(id)+'">'+
'<div class="rd-fav-item-image">'+
(im?'<img src="'+esc(im)+'" alt="'+esc(t)+'" loading="lazy">':'')+
'</div>'+
'<div class="rd-fav-item-copy">'+
'<div class="rd-fav-item-title">'+esc(t)+'</div>'+
(m?'<div class="rd-fav-item-meta">'+esc(m)+'</div>':'')+
(p?'<div class="rd-fav-item-price">'+esc(p)+'</div>':'')+
'</div>'+
'</a>'+
'<button aria-label="Удалить из избранного" class="rd-fav-item-remove" data-remove-favorite="'+esc(id)+'" type="button">'+
'<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">'+
'<path d="m6 6 12 12M18 6 6 18"></path>'+
'</svg>'+
'</button>'+
'</div>'
}
var favPopup=document.getElementById('rdFavoritesPopup'),
favBody=favPopup&&favPopup.querySelector('#rdFavoritesPopupBody'),
favCount=favPopup&&favPopup.querySelector('#rdFavoritesPopupCount');
function openFavorites(){
if(!favPopup)return;
favPopup.classList.add('open');
favPopup.setAttribute('aria-hidden','false');
document.documentElement.style.overflow='hidden';
syncFavoriteButton();
renderFavoritesPopup()
}
function closeFavorites(){
if(!favPopup)return;
favPopup.classList.remove('open');
favPopup.setAttribute('aria-hidden','true');
document.documentElement.style.overflow=
menu&&menu.classList.contains('open')?'hidden':'';
syncFavoriteButton()
}
async function renderFavoritesPopup(){
if(!favPopup||!favBody)return;
var ids=getFavs();
if(favCount)
favCount.textContent=String(ids.length);
if(!ids.length){
favBody.innerHTML=
'<div class="rd-fav-popup-empty">В избранном пока ничего нет.</div>';
return
}
favBody.innerHTML=
'<div class="rd-fav-popup-loading">Загрузка избранных автомобилей…</div>';
var seq=++favoriteLoadSeq,
items=[];
for(var i=0;i<ids.length;i++){
if(!isFav(ids[i]))
continue;
try{
var c=await getListing(ids[i]);
if(seq!==favoriteLoadSeq)
return;
if(c&&typeof c==='object')
items.push(c);
}catch(e){
if(seq!==favoriteLoadSeq)
return;
}
}
var now=getFavs();
if(seq!==favoriteLoadSeq)
return;
items=items.filter(function(c){
return c&&c.id!=null&&now.indexOf(String(c.id))>=0
});
favBody.innerHTML=items.length
?items.map(item).join('')
:'<div class="rd-fav-popup-empty">Не удалось загрузить избранные автомобили.</div>'
}
if(favBody)
favBody.addEventListener('click',function(e){
var b=e.target.closest('[data-remove-favorite]');
if(!b)return;
e.preventDefault();
e.stopPropagation();
removeFav(b.getAttribute('data-remove-favorite'));
favoriteLoadSeq++;
syncFavoriteButton();
renderFavoritesPopup()
});
if(favPopup){
favPopup.addEventListener('click',function(e){
if(e.target===favPopup)
closeFavorites()
});
var fc=favPopup.querySelector('#rdFavoritesPopupClose');
if(fc)
fc.addEventListener('click',closeFavorites)
}
var fb=root.querySelector('#cvFavorites');
if(fb)
fb.addEventListener('click',function(e){
e.preventDefault();
e.stopPropagation();
favPopup&&favPopup.classList.contains('open')
?closeFavorites()
:openFavorites()
});
syncFavoriteButton();
window.addEventListener('storage',function(e){
if(e.key===favoriteKey){
syncFavoriteButton();
if(favPopup&&favPopup.classList.contains('open'))
renderFavoritesPopup()
}
});
window.addEventListener('red-dragon:favorites-changed',function(){
syncFavoriteButton();
if(favPopup&&favPopup.classList.contains('open'))
renderFavoritesPopup()
});
document.addEventListener('keydown',function(e){
if(e.key==='Escape'){
if(favPopup&&favPopup.classList.contains('open'))
closeFavorites();
else if(menu&&menu.classList.contains('open'))
closeMenu();
}
});
window.RDRedDragonHeader=window.RDRedDragonHeader||{};
window.RDRedDragonHeader.getFavorites=getFavs;
window.RDRedDragonHeader.getFavoriteCount=function(){
return getFavs().length
};
window.RDRedDragonHeader.isFavorite=isFav;
window.RDRedDragonHeader.toggleFavorite=function(id){
id=String(id);
var a=getFavs(),
i=a.indexOf(id);
if(i>=0)
a.splice(i,1);
else
a.push(id);
setFavs(a);
return a.indexOf(id)>=0
};
window.RDRedDragonHeader.openFavorites=openFavorites;
window.RDRedDragonHeader.closeFavorites=closeFavorites;
}
if(document.readyState==='loading')
document.addEventListener('DOMContentLoaded',init,{once:true});
else
init();
})();
</script>
