name: Adapt car page once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  adapt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Tilda form bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('pages/car.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'\s*<script>\s*\(function\(\)\{\s*[\'\"]use strict[\'\"];.*?</script>\s*$'
          native=''' <script>(function(){'use strict';var busy=false;function finish(card,f){var modal=card.querySelector('#rd-feedback-modal');var success=card.querySelector('[data-feedback-success],.rd-feedback-success');if(modal){modal.classList.remove('open');modal.setAttribute('aria-hidden','true')}if(success){success.style.display='block';setTimeout(function(){success.style.display='none'},5000)}if(f)f.reset()}function start(){var card=document.querySelector('#rd-red-dragon-card');if(!card)return;var f=card.querySelector('#rd-feedback-form'),b=f&&f.querySelector('.rd-feedback-submit');if(!f||!b||b.dataset.rdBound)return;var n=f.querySelector('[name="feedback-name"]'),p=f.querySelector('[name="feedback-phone"]');if(!n||!p)return;b.dataset.rdBound='1';b.addEventListener('click',async function(e){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();if(busy)return;var name=(n.value||'').trim(),phone=(p.value||'').trim();if(!name){n.focus();return}if(!phone){p.focus();return}var l=window.__rdCurrentListing||window.__rdListing||{},br=l.brand,mo=l.model;br=typeof br==='object'?(br.name||br.title||''):(l.brandName||br||'');mo=typeof mo==='object'?(mo.name||mo.title||''):(l.modelName||mo||'');var car=(l.title||(br+' '+mo).trim()||'Автомобиль').trim(),fd=new FormData;fd.append('name',name);fd.append('phone',phone);fd.append('message',['Автомобиль: '+car,l.year?'Год: '+l.year:'',l.priceUsd||l.price?'Цена: '+(l.priceUsd||l.price):'',l.id?'ID автомобиля: '+l.id:'',l.vin||l.VIN?'VIN: '+(l.vin||l.VIN):'','URL: '+location.href].filter(Boolean).join('\\n'));busy=true;b.disabled=true;try{var r=await fetch('/api/lead',{method:'POST',body:fd,headers:{Accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);finish(card,f)}catch(err){console.error('[RD/lead]',err);alert('Не удалось отправить заявку. Попробуйте ещё раз.')}finally{b.disabled=false;busy=false}},true)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start()})();</script>'''
          ns,n=re.subn(pattern,native,s,flags=re.S)
          if n!=1:
              raise SystemExit(f'car handler replacement count={n}')
          p.write_text(ns,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/car.html
          git commit -m 'Adapt car form for clean server'
          git push
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/adapt-car-once.yml
          git add .github/workflows/adapt-car-once.yml
          git commit -m 'Remove temporary car migration workflow'
          git push
