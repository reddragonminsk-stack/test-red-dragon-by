name: adapt-usa-once
permissions:
  contents: write
on:
  push:
    paths:
      - '.github/workflows/adapt-usa-once.yml'
jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adapt USA page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('pages/usa.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://static.tildacdn.biz/tild3038-3763-4366-a631-373064343639/Can-you-put-stuff-in.jpg','/assets/images/Can-you-put-stuff-in.jpg')
          old='class="rdu-native-form t-form js-form-proccess" role="form" action="https://forms.tildacdn.com/procces/" method="POST" data-vibeblock-form="true" data-inputbox=".vb-input-group" data-formactiontype="2" data-success-popup="y" data-error-popup="y" novalidate=""'
          new='class="rdu-native-form" role="form" action="/api/lead" method="POST" novalidate'
          if old not in s: raise SystemExit('USA form signature not found')
          s=s.replace(old,new)
          s=s.replace(' class="rdu-input js-tilda-rule"',' class="rdu-input"').replace(' class="rdu-select js-tilda-rule"',' class="rdu-select"').replace(' class="rdu-textarea js-tilda-rule"',' class="rdu-textarea"')
          s=s.replace(' data-tilda-req="1"','').replace(' data-tilda-rule="name"','').replace(' data-tilda-rule="phone"','').replace(' data-tilda-rule="string"','').replace(' data-tilda-rule="number"','')
          s=s.replace(' class="js-successbox t-form__successbox"',' class="rdu-successbox"')
          s=s.replace('<div class="js-errorbox-all" style="display:none">\n<div class="js-rule-error-all"></div>\n</div>','')
          s=s.replace('<div class="t-input-error"></div>','')
          s=re.sub(r'<input type="hidden" name="formservices\[\]"[^>]*>\s*','',s)
          s=s.replace(' class="rdu-btn rdu-btn-primary rdu-submit t-submit t-btnflex t-btnflex_lg"',' class="rdu-btn rdu-btn-primary rdu-submit"').replace('<span class="t-btnflex__text">','<span>')
          start=s.find("if(form&&submitButton){\nform.addEventListener(")
          end=s.find("var phoneInput=byId('rduSelPhone');",start)
          if start<0 or end<0: raise SystemExit('USA submit handler boundaries not found')
          new_handler="if(form&&submitButton){form.addEventListener('submit',function(event){event.preventDefault();if(!validPhone()){showPhoneError();if(phoneInput)phoneInput.focus();return}var formData=new FormData(form);var box=form.querySelector('.rdu-successbox');submitButton.disabled=true;fetch('/api/lead',{method:'POST',body:formData,headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);if(box){box.textContent='Спасибо! Ваша заявка отправлена. Мы скоро свяжемся с вами.';box.style.display='block';box.classList.remove('err')}form.reset();initPhone();updateChannels();}).catch(function(){if(box){box.textContent='Не удалось отправить заявку. Попробуйте ещё раз.';box.style.display='block';box.classList.add('err')}}).finally(function(){submitButton.disabled=false})})}\n"
          s=s[:start]+new_handler+s[end:]
          s=s.replace('.rdu-native-form .js-successbox','.rdu-native-form .rdu-successbox').replace('.rdu-native-form .js-errorbox-all','.rdu-native-form .rdc-unused-errorbox').replace('.rdu-native-form .js-rule-error-all','.rdu-native-form .rdc-unused-rule-error').replace('.rdu-native-form .t-input-error','.rdu-native-form .rdc-unused-error').replace('.rdu-submit.t-submit','.rdu-submit').replace('.t-btnflex__text','.rdc-unused-btn-text').replace('.t-btnflex__icon','.rdc-unused-btn-icon')
          s=re.sub(r'\n#red-dragon-usa \.rdu-native-form \.rdc-unused-errorbox\{[^}]*\}','',s)
          s=re.sub(r'\n#red-dragon-usa \.rdu-native-form \.rdc-unused-rule-error\{[^}]*\}','',s)
          s=re.sub(r'\n#red-dragon-usa \.rdu-native-form \.rdc-unused-error\{[^}]*\}','',s)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/usa.html
          git commit -m 'Adapt USA page for clean server'
          git rm .github/workflows/adapt-usa-once.yml
          git commit -m 'Remove temporary USA adaptation workflow'
          git push
# retrigger