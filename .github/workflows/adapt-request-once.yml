name: adapt-request-once
on:
  push:
    paths:
      - 'pages/request.html'
      - '.github/workflows/adapt-request-once.yml'
permissions:
  contents: write
jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adapt request form
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages/request.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://static.tildacdn.biz/tild3636-3539-4462-b938-643262366435/photo-1565043666747-.jpg','/assets/images/photo-1565043666747-.jpg')
          s=s.replace('class="rds-native-form t-form js-form-proccess" role="form" action="https://forms.tildacdn.com/procces/" method="POST" data-vibeblock-form="true" data-inputbox=".vb-input-group" data-formactiontype="2" data-success-popup="y" data-error-popup="y" novalidate=""','class="rds-native-form" role="form" action="/api/lead" method="POST" novalidate')
          s=s.replace(' class="rds-input js-tilda-rule"',' class="rds-input"').replace(' class="rds-select js-tilda-rule"',' class="rds-select"').replace(' class="rds-textarea js-tilda-rule"',' class="rds-textarea"')
          s=s.replace(' data-tilda-req="1"','').replace(' data-tilda-rule="name"','').replace(' data-tilda-rule="phone"','').replace(' data-tilda-rule="string"','').replace(' data-tilda-rule="number"','')
          s=s.replace(' class="rds-submit t-submit t-btnflex t-btnflex_lg"',' class="rds-submit"')
          s=s.replace(' class="js-successbox t-form__successbox"',' class="js-successbox"')
          s=s.replace('<div class="js-errorbox-all" style="display:none"><div class="js-rule-error-all"></div></div>','')
          while '<div class="t-input-error"></div>' in s: s=s.replace('<div class="t-input-error"></div>','')
          import re
          s=re.sub(r'<input type="hidden" name="formservices\[\]"[^>]*>\s*','',s)
          p.write_text(s,encoding='utf-8')
          PY
          grep -qiE 'tildacdn|forms\.tilda|data-tilda|js-tilda-rule|t-submit|t-btnflex|t-input-error|formservices\[\]|js-form-proccess|\bt-form\b' pages/request.html && { echo 'Tilda remnants found'; exit 1; } || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/request.html
          git diff --cached --quiet && exit 0
          git commit -m 'Adapt request page for clean server'
          git push
