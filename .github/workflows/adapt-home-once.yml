name: Adapt home once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  adapt:
    if: "!contains(github.event.head_commit.message, '[home-adapted]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Tilda assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/home.html')
          s=p.read_text(encoding='utf-8')
          repl={
            'https://static.tildacdn.biz/tild3939-3862-4134-a463-636563343537/Logo-One-01-Shadow.png':'/assets/images/Logo-One-01-Shadow.png',
            'https://static.tildacdn.biz/tild3936-6230-4762-b734-616235366132/flag-south-korea-rou.jpg':'/assets/images/flag-south-korea-rou.jpg',
            'https://static.tildacdn.biz/tild3236-6661-4234-b532-373737636239/250px-Flag_of_the_Pe.jpg':'/assets/images/250px-Flag_of_the_Pe.jpg',
            'https://static.tildacdn.biz/tild3733-3439-4336-b163-346463356262/Flag_of_South_Korea.jpg':'/assets/images/Flag_of_South_Korea.jpg',
          }
          for a,b in repl.items(): s=s.replace(a,b)
          s=s.replace('https://red-dragon.by/catalog/','/catalog/').replace('https://red-dragon.by/catalog#','/catalog/#')
          p.write_text(s,encoding='utf-8',newline='')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/home.html
          git diff --cached --quiet || git commit -m "[home-adapted] Adapt main home page for clean server"
          git push