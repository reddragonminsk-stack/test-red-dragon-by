<div id="rd-red-dragon-catalog"></div>
<style>
#rd-red-dragon-catalog{--rd-bg:#f5f5f5;--rd-surface:#fff;--rd-default:#ebebec;--rd-foreground:#18181b;--rd-muted:#71717a;--rd-border:#dedee0;--rd-accent:#d92f2f;--rd-accent-g:linear-gradient(135deg,#c1272d 0%,#a01818 45%,#7a0d0d 75%,#4a0606 100%);--rd-accent-g-text:linear-gradient(135deg,#b81f23 0%,#8b1316 40%,#5e0808 75%,#2d0303 100%);--rd-accent-fg:#fff;--rd-soft:rgba(217,47,47,.08);--rd-accent-border:rgba(217,47,47,.22);font-family:Inter,Arial,sans-serif;color:var(--rd-foreground);background:var(--rd-bg);-webkit-font-smoothing:antialiased}
#rd-red-dragon-catalog[data-theme=dark]{--rd-bg:#0f0f10;--rd-surface:#18181b;--rd-default:#27272a;--rd-foreground:#e7e7e7;--rd-muted:#a1a1aa;--rd-border:#2d2d30;--rd-accent:#d92f2f;--rd-accent-g:linear-gradient(135deg,#c1272d 0%,#a01818 45%,#7a0d0d 75%,#4a0606 100%);--rd-accent-g-text:linear-gradient(135deg,#d83b40 0%,#b52226 40%,#8c1518 75%,#5a0808 100%);--rd-accent-fg:#fff;--rd-soft:rgba(217,47,47,.12);--rd-accent-border:rgba(217,47,47,.26)}
#rd-red-dragon-catalog *{box-sizing:border-box}
#rd-red-dragon-catalog{overflow-x:hidden}
#rd-red-dragon-catalog button,#rd-red-dragon-catalog input,#rd-red-dragon-catalog select{font:inherit}
#rd-red-dragon-catalog button{cursor:pointer}
#rd-red-dragon-catalog img{display:block;max-width:100%}
#rd-red-dragon-catalog a{color:inherit}
.rd-main{max-width:1152px;margin:0 auto;padding:24px 16px 48px}
.rd-breadcrumb{display:flex;align-items:center;gap:7px;margin:0 0 16px;font-size:13px;line-height:18px;color:var(--rd-muted)}
.rd-breadcrumb a{text-decoration:none;color:var(--rd-muted);transition:color .15s}
.rd-breadcrumb a:hover{color:var(--rd-foreground)}
.rd-breadcrumb-sep{color:var(--rd-muted);opacity:.7}
.rd-breadcrumb-current{color:var(--rd-foreground)}
.rd-heading{margin-bottom:24px}
.rd-heading h1{margin:0;font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.025em;background:var(--rd-accent-g-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 18px rgba(120,10,10,.12))}
.rd-heading p{max-width:720px;margin:8px 0 0;color:var(--rd-muted);font-size:16px;line-height:24px}
.rd-mobile-delivery-note{display:inline}
.rd-layout{display:flex;gap:16px;align-items:flex-start}
.rd-sidebar-wrap{width:288px;flex:0 0 288px}
.rd-sidebar{position:sticky;top:16px;max-height:none;overflow:visible;min-width:0;width:100%}
.rd-source-sidebar{border:1px solid var(--rd-border);border-radius:16px;background:var(--rd-surface);padding:20px 20px 12px;overflow:visible;min-width:0;max-width:100%;width:100%}
.rd-filter-stack{display:flex;flex-direction:column;gap:12px;min-width:0;width:100%}
.rd-autocomplete,.rd-selectbox{position:relative;min-width:0;width:100%}
.rd-source-label{display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px;font-weight:500;color:var(--rd-foreground);margin:0 0 2px}
.rd-autotrigger,.rd-seltrigger{isolation:isolate;min-height:36px;width:100%;border:1px solid var(--rd-border);border-radius:12px;background:var(--rd-default);color:var(--rd-foreground);padding:8px 12px;font-size:14px;line-height:20px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;user-select:none;transition:background .15s,border-color .15s,box-shadow .15s}
.rd-autotrigger:hover,.rd-seltrigger:hover{background:#e5e5e6}
.rd-autotrigger:disabled{opacity:.5;cursor:not-allowed}
.rd-autotrigger:focus-visible,.rd-seltrigger:focus-visible,.rd-filter-input:focus{outline:none;border-color:var(--rd-accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--rd-accent) 20%,transparent);background:var(--rd-surface)}
.rd-field-value{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.rd-field-placeholder{color:var(--rd-muted)}
.rd-indicator{width:16px;height:16px;flex:0 0 16px;color:var(--rd-muted);transition:transform .18s}
.rd-autocomplete.open .rd-indicator,.rd-selectbox.open .rd-indicator,.rd-sortbox.open .rd-sort-indicator{transform:rotate(180deg)}
.rd-autopop,.rd-options-pop,.rd-sort-pop{display:none;position:absolute;z-index:1000;background:var(--rd-surface);border:1px solid var(--rd-border);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.14);overflow:hidden;padding:6px}
.rd-autopop{left:0;right:0;top:61px;max-height:320px;overflow:hidden}
.rd-options-pop{left:0;right:0;top:44px;max-height:320px;overflow-y:auto;overflow-x:hidden}
.rd-sort-pop{right:0;top:42px;min-width:230px}
.rd-autocomplete.open .rd-autopop,.rd-selectbox.open .rd-options-pop,.rd-sortbox.open .rd-sort-pop{display:block}
.rd-auto-search{height:36px;flex:0 0 36px;width:100%;border:1px solid var(--rd-border);border-radius:10px;background:var(--rd-default);color:var(--rd-foreground);padding:0 10px;outline:0;font-size:13px;margin-bottom:6px}
.rd-autolist{min-height:0;overflow-y:auto;overflow-x:hidden;max-height:255px;padding-right:2px}
.rd-autolist::-webkit-scrollbar,.rd-options-pop::-webkit-scrollbar{width:6px}
.rd-autolist::-webkit-scrollbar-thumb,.rd-options-pop::-webkit-scrollbar-thumb{background:rgba(120,120,120,.35);border-radius:999px}
.rd-autolist{scrollbar-width:thin}
.rd-auto-search:focus{border-color:var(--rd-accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--rd-accent) 18%,transparent)}
.rd-pop-caption{padding:7px 8px 5px;color:var(--rd-muted);font-size:12px;line-height:16px}
.rd-option{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;min-height:34px;border:0;border-radius:8px;padding:7px 9px;background:transparent;color:var(--rd-foreground);font-size:14px;line-height:20px;text-align:left}
.rd-option:hover{background:var(--rd-default)}
.rd-option:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.rd-option[aria-selected=true],.rd-option[aria-checked=true]{background:var(--rd-soft);font-weight:500}
.rd-option-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-option-right{display:inline-flex;align-items:center;gap:8px;flex:0 0 auto}
.rd-option-count{color:var(--rd-muted);font-size:12px;font-variant-numeric:tabular-nums}
.rd-option-check{color:var(--rd-accent);font-weight:700;flex:0 0 auto}
.rd-seltrigger:disabled{opacity:.5;cursor:not-allowed}
.rd-selectbox.is-disabled .rd-indicator{opacity:.5}
.rd-country-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;min-width:0;width:100%}
.rd-country-group{display:inline-flex;width:fit-content;border-radius:12px;overflow:hidden;background:var(--rd-default);height:36px;border:1px solid var(--rd-border)}
.rd-country-btn{position:relative;height:35px;border:0;border-radius:0;background:var(--rd-default);color:var(--rd-foreground);padding:0 14px;min-width:54px;font-size:14px;font-weight:500;transition:transform .25s ease,background-color .1s ease,box-shadow .1s ease}
.rd-country-btn+.rd-country-btn:before{content:"";position:absolute;left:0;top:25%;bottom:25%;width:1px;background:currentcolor;opacity:.15}
.rd-country-btn:hover{background:var(--rd-default)}
.rd-country-btn.active{background:var(--rd-accent-g);color:#fff;box-shadow:0 4px 14px rgba(150,15,15,.2)}
.rd-country-btn:active{transform:scale(.97)}
.rd-source-tools{display:flex;align-items:center;gap:4px;padding-bottom:0;min-width:0;max-width:100%;flex-wrap:wrap}
.rd-source-separator{height:24px;width:1px;background:var(--rd-border);margin:0 4px}
.rd-source-ghost{height:36px;display:inline-flex;max-width:100%;align-items:center;justify-content:center;gap:7px;border:1px solid var(--rd-border);background:transparent;color:var(--rd-foreground);border-radius:10px;padding:0 10px;font-size:14px;font-weight:500}
.rd-source-ghost:hover,.rd-icon-info:hover{background:var(--rd-default)}
.rd-source-ghost.active{background:var(--rd-accent-g);border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(150,15,15,.24)}
.rd-icon-info{width:28px;height:28px;position:relative;border:0;background:transparent;border-radius:8px;color:var(--rd-muted);display:grid;place-items:center;padding:0}
.rd-source-tools [data-action="first-line"],.rd-source-tools [data-info="report"]{display:none!important}
.rd-block{display:flex;flex-direction:column;min-width:0;width:100%}
.rd-block-label{display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px;font-weight:500;margin-bottom:6px;color:var(--rd-foreground)}
.rd-icon-badge{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:rgba(120,120,120,.08);color:var(--rd-muted)}
.rd-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;min-width:0;width:100%}
.rd-numberbox{display:flex;align-items:center;width:100%;min-width:0;min-height:36px;border:1px solid var(--rd-border);border-radius:12px;background:var(--rd-default);padding:0 4px 0 12px;transition:.15s}
.rd-numberbox:focus-within{border-color:var(--rd-accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--rd-accent) 18%,transparent);background:var(--rd-surface)}
.rd-filter-input{min-width:0;flex:1;height:34px;border:0;background:transparent;color:var(--rd-foreground);outline:0;font-size:14px;padding:0}
.rd-filter-input::placeholder{color:var(--rd-muted)}
.rd-clear-input{width:24px;height:24px;border:0;background:transparent;color:var(--rd-muted);border-radius:7px;display:grid;place-items:center;padding:0;opacity:0}
.rd-numberbox.filled .rd-clear-input{opacity:1}
.rd-clear-input:hover{background:rgba(120,120,120,.12);color:var(--rd-foreground)}
.rd-option-checkbox{width:16px;height:16px;border:1px solid var(--rd-border);border-radius:4px;display:inline-grid;place-items:center;color:transparent;margin-right:8px;flex:0 0 16px;font-size:11px}
.rd-option[aria-checked=true] .rd-option-checkbox{background:var(--rd-accent);border-color:var(--rd-accent);color:var(--rd-accent-fg)}
.rd-mileage-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rd-switch-line{display:flex;align-items:center;gap:5px}
.rd-switch{position:relative;width:34px;height:20px;border-radius:999px;border:1px solid var(--rd-border);background:var(--rd-default);padding:0}
.rd-switch i{position:absolute;top:3px;left:3px;width:12px;height:12px;background:var(--rd-muted);border-radius:50%;transition:.18s}
.rd-switch.on{background:var(--rd-accent-g);border-color:transparent;box-shadow:0 3px 10px rgba(150,15,15,.22)}
.rd-switch.on i{left:17px;background:#fff}
.rd-switch-label{font-size:12px;color:var(--rd-muted)}
.rd-disclosure-source{border:1px solid var(--rd-border);border-radius:10px;overflow:hidden}
.rd-disclosure-source>button{width:100%;height:40px;border:0;background:transparent;color:var(--rd-foreground);padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;font-size:14px;font-weight:500}
.rd-disclosure-source>button:hover{background:var(--rd-default)}
.rd-disclosure-source .rd-disclosure-body{display:none;padding:0 12px 12px}
.rd-disclosure-source.open .rd-disclosure-body{display:block}
.rd-chip-source{height:32px;border:1px solid var(--rd-border);border-radius:999px;background:var(--rd-surface);color:var(--rd-foreground);padding:0 11px;font-size:13px;font-weight:500}
.rd-chip-source:hover{background:var(--rd-default)}
.rd-chip-source.active{background:var(--rd-accent-g);border-color:transparent;color:#fff;box-shadow:0 3px 12px rgba(150,15,15,.18)}
.rd-reset-source{height:36px;width:100%;border:0;background:transparent;color:var(--rd-muted);border-radius:9px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px}
.rd-reset-source:hover:not(:disabled){background:var(--rd-default);color:var(--rd-foreground)}
.rd-reset-source:disabled{opacity:.5;cursor:not-allowed}
.rd-tooltip{position:fixed;display:none;z-index:100001;max-width:280px;padding:9px 11px;border:1px solid var(--rd-border);border-radius:9px;background:var(--rd-surface);color:var(--rd-foreground);box-shadow:0 10px 24px rgba(0,0,0,.14);font-size:12px;line-height:17px}
.rd-popular-side{padding-top:2px}
.rd-popular-side p{margin:0 0 6px;font-size:12px;line-height:16px;color:var(--rd-muted)}
.rd-popular-side-row{display:flex;flex-direction:column;gap:2px}
.rd-popular-side-row .rd-option{min-height:30px;padding:5px 7px;font-size:13px}
.rd-results{min-width:0;flex:1}
.rd-popular-top{display:flex;align-items:center;flex-wrap:wrap;gap:4px 7px;margin:0 0 12px;padding:0}
.rd-popular-top-label{flex:0 0 auto;font-size:12px;color:var(--rd-muted);font-weight:500;margin-right:2px}
.rd-popular-top .rd-chip-source{height:27px;padding:0 7px;font-size:10px;line-height:27px;white-space:nowrap}
.rd-search-wrap{position:relative;margin-bottom:12px}
.rd-search{height:44px;width:100%;border:1px solid var(--rd-border);border-radius:12px;background:var(--rd-surface);color:var(--rd-foreground);padding:0 44px 0 40px;font-size:14px;outline:0}
.rd-search::placeholder{color:var(--rd-muted)}
.rd-search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--rd-muted);pointer-events:none}
.rd-search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;background:transparent;color:var(--rd-muted);border-radius:8px;display:none;place-items:center}
.rd-search-wrap.filled .rd-search-clear{display:grid}
.rd-search-clear:hover{background:var(--rd-default);color:var(--rd-foreground)}
.rd-active-source{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.rd-active-source:empty{display:none}
.rd-active-source button{height:30px;border:1px solid var(--rd-border);border-radius:999px;background:var(--rd-surface);color:var(--rd-foreground);padding:0 9px;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.rd-active-source button svg{width:12px;height:12px;color:var(--rd-muted)}
.rd-toolbar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px;padding:6px 0;background:linear-gradient(var(--rd-bg) 0%,var(--rd-bg) 82%,transparent 100%)}
.rd-toolbar-left{display:flex;align-items:center;gap:8px;min-width:0}
.rd-count{display:inline-flex;align-items:center;gap:7px;font-size:16px;font-weight:700;white-space:nowrap}
.rd-count svg{width:17px;height:17px;color:var(--rd-accent)}
.rd-count-mobile{display:none}
.rd-subscribe{height:36px;display:inline-flex;align-items:center;gap:7px;padding:0 10px;text-decoration:none;cursor:pointer;border:1px solid var(--rd-border);background:var(--rd-surface);border-radius:9px;color:var(--rd-muted);font-size:13px;font-weight:500}
.rd-subscribe:hover{background:var(--rd-default);color:var(--rd-foreground)}
.rd-toolbar-right{display:flex;align-items:center;gap:8px}
.rd-sortbox{position:relative;display:block}
.rd-sorttrigger{height:36px;border:1px solid var(--rd-border);background:var(--rd-surface);color:var(--rd-foreground);border-radius:9px;padding:0 10px;display:inline-flex;align-items:center;gap:7px;font-size:13px}
.rd-sorttrigger:hover{background:var(--rd-default)}
.rd-sort-indicator{width:15px;height:15px;color:var(--rd-muted);transition:transform .18s}
.rd-sort-option{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:36px;border:0;border-radius:8px;background:transparent;color:var(--rd-foreground);padding:0 10px;font-size:13px;text-align:left}
.rd-sort-option:hover{background:var(--rd-default)}
.rd-sort-option.active{background:var(--rd-accent-g);color:#fff;font-weight:600}
.rd-sort-check{color:#fff}
.rd-view-group{display:flex;align-items:center;border:1px solid var(--rd-border);border-radius:10px;overflow:hidden;background:var(--rd-surface)}
.rd-view{width:36px;height:34px;border:0;background:var(--rd-surface);color:var(--rd-muted);display:grid;place-items:center}
.rd-view+.rd-view{border-left:1px solid var(--rd-border)}
.rd-view:hover{background:var(--rd-default);color:var(--rd-foreground)}
.rd-view.active{background:var(--rd-accent-g);color:#fff}
.rd-mobile-filter-button{display:none;height:36px;border:1px solid var(--rd-border);background:var(--rd-surface);color:var(--rd-foreground);border-radius:9px;padding:0 11px;font-size:13px;font-weight:500;align-items:center;gap:7px}
.rd-mobile-reset-filter{display:none}
.rd-mobile-filters{display:none}
.rd-mobile-quick-filters{display:none}
.rd-mobile-source-head,.rd-mobile-source-footer{display:none}
.rd-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.rd-grid.list{grid-template-columns:1fr}
.rd-card{overflow:hidden;border:1px solid color-mix(in srgb,var(--rd-border) 90%,transparent);border-radius:16px;background:var(--rd-surface);transition:box-shadow .2s,border-color .2s}
.rd-card:hover{border-color:color-mix(in srgb,var(--rd-foreground) 15%,var(--rd-border));box-shadow:0 10px 30px rgba(0,0,0,.08)}
.rd-card-link{display:block;text-decoration:none}
.rd-grid.list .rd-card-link{display:grid;grid-template-columns:280px minmax(0,1fr)}
.rd-card-media{position:relative;aspect-ratio:4/3;background:var(--rd-default);overflow:hidden}
.rd-grid.list .rd-card-media{height:100%;min-height:190px;aspect-ratio:auto}
.rd-carousel{position:absolute;inset:0;overflow:hidden}
.rd-carousel-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:translateX(0);transition:opacity .28s ease,transform .32s cubic-bezier(.22,.61,.36,1)}
.rd-carousel-layer.active{opacity:1;transform:translateX(0)}
.rd-card:hover .rd-carousel-layer.active{transform:scale(1.012)}
.rd-card-top{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;z-index:8;pointer-events:none}
.rd-card-top-left{display:flex;align-items:center;gap:6px;min-width:0}
.rd-badge{height:26px;display:inline-flex;align-items:center;padding:0 8px;border-radius:8px;background:rgba(255,255,255,.94);color:#111;font-size:11px;font-weight:700}
.rd-fav{position:relative;width:32px;height:32px;flex:0 0 32px;display:grid;place-items:center;padding:0;border:1px solid rgba(255,255,255,.15);border-radius:50%;background:rgba(0,0,0,.35);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .2s ease-out,background-color .2s ease-out,border-color .2s ease-out,box-shadow .2s ease-out;pointer-events:auto;cursor:pointer}
.rd-fav:before{content:"";position:absolute;inset:-6px;border-radius:50%}
.rd-fav:hover{background:rgba(0,0,0,.5)}
.rd-fav:active{transform:scale(.9)}
.rd-fav:focus-visible{outline:none;box-shadow:0 0 0 2px var(--rd-accent),0 0 0 4px rgba(255,255,255,.2)}
.rd-fav svg{width:16px;height:16px;display:block;transition:color .2s ease,fill .2s ease}
.rd-fav.active svg{color:var(--rd-accent)}
.rd-card-country-bottom{position:absolute;left:10px;bottom:20px;z-index:10;display:inline-flex;align-items:center;justify-content:center;height:25px;pointer-events:none}
.rd-card-country-bottom .rd-flag{display:block;width:auto;height:25px;overflow:hidden;border-radius:3px;line-height:0}
.rd-card-country-bottom .rd-flag img{display:block;width:auto;height:25px;object-fit:contain;border:0}
.rd-progress{position:absolute;left:10px;right:10px;bottom:9px;display:flex;gap:3px;z-index:9;pointer-events:none}
.rd-progress span{height:2px;flex:1;background:rgba(255,255,255,.48);border-radius:999px;transition:background .18s ease}
.rd-progress span.active{background:#fff}
.rd-zones{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);z-index:5}
.rd-zone{height:100%;width:100%;padding:0;border:0;background:transparent}
.rd-card-photos{position:absolute;right:10px;bottom:20px;height:28px;display:inline-flex;align-items:center;gap:5px;padding:0 9px;border-radius:8px;background:rgba(17,17,17,.72);backdrop-filter:blur(5px);color:#fff;font-size:11px;font-weight:600;z-index:8;pointer-events:none}
.rd-card-body{padding:14px}
.rd-card-title{margin:0;font-size:15px;line-height:20px;font-weight:600;letter-spacing:-.01em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.rd-price-block{margin-top:8px}
.rd-price-caption{display:block;font-size:11px;line-height:14px;font-weight:500;color:var(--rd-muted)}
.rd-price-row{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-top:3px}

ителей и автомобили международных марок, доступные на китайском рынке. Выберите марку и модель, задайте бюджет и дополнительные параметры, чтобы найти подходящие варианты.</p><h2>Автомобили из Кореи с доставкой в Беларусь</h2><p>Красный Дракон помогает подбирать автомобили с корейских площадок. Вы можете сравнить варианты по стоимости, году выпуска, пробегу, типу топлива и другим характеристикам, а затем запросить расчёт доставки в Беларусь.</p><h2>Автомобили из США</h2><p>Автомобили из США также являются отдельным направлением поставок Красного Дракона. Для конкретного автомобиля можно уточнить доступность, характеристики и итоговую стоимость поставки.</p><h2>Как выбрать автомобиль</h2><h3>Выберите марку и модель</h3><p>Начните с выбора производителя и модели. В каталоге доступны популярные марки, а также широкий перечень других производителей.</p><h3>Задайте бюджет и характеристики</h3><p>Используйте фильтры по цене, году выпуска, пробегу, топливу, кузову, коробке передач, приводу и цвету. Это позволяет сократить количество подходящих предложений.</p><h3>Уточните стоимость доставки</h3><p>Цена автомобиля в карточке и окончательная стоимость поставки — разные показатели. После выбора автомобиля партнёр может уточнить стоимость доставки и обязательных платежей.</p><h2>Красный Дракон — поставка автомобилей в Беларусь</h2><p>Мы помогаем подобрать автомобили из Китая, Кореи и США и организовать их поставку в Беларусь. Используйте каталог для поиска подходящего варианта или отправьте заявку на подбор, если нужного автомобиля нет среди найденных предложений.</p></section></section></div></main><div class="rd-tooltip" id="rd-tooltip"></div>'}

if(a==='first-line'){state.firstLine=!state.firstLine;state.page=1;catalog.hasMore=true;saveSavedFilters();renderSidebar();await loadListings();return}
if(a==='new-cars'){state.newCars=!state.newCars;if(state.newCars){state.minMileage='';state.maxMileage='300'}else state.maxMileage='';state.page=1;catalog.hasMore=true;saveSavedFilters();renderSidebar();await loadListings();return}
if(a==='advanced'){catalog.advanced=!catalog.advanced;renderSidebar();if(catalog.advanced&&mobileHistoryEnabled())scrollMobileToTarget(root.querySelector('.rd-mobile-source .rd-disclosure-source.open'));return}
if(t.hasAttribute('data-info')){if(mobileHistoryEnabled()){e.preventDefault();e.stopPropagation();toggleMobileInfo(t)}return}
if(t.hasAttribute('data-auto-clear')){var ck=t.getAttribute('data-auto-clear');state[ck]='';if(ck==='brand')state.model='';if(ck==='country'){catalog.countryApiKey=null;catalog.countryApiValue=null}state.page=1;catalog.hasMore=true;saveSavedFilters();renderSidebar();await loadListings();return}
if(t.hasAttribute('data-clear-search')){state.q='';saveSavedFilters();syncSearch();state.page=1;catalog.hasMore=true;renderActiveFilters();await loadListings();return}
if(t.hasAttribute('data-brand')){await changeFilter('brand',t.getAttribute('data-brand'));closeFilterPops();return}
if(t.hasAttribute('data-model')){if(!state.brand)return;await changeFilter('model',t.getAttribute('data-model'));closeFilterPops();return}
if(t.hasAttribute('data-country')){state.country=t.getAttribute('data-country');catalog.countryApiKey=null;catalog.countryApiValue=null;state.page=1;catalog.hasMore=true;saveSavedFilters();renderSidebar();await loadListings();return}
if(t.hasAttribute('data-popular')){await changeFilter('brand',t.getAttribute('data-popular'));return}
if(t.hasAttribute('data-auto-open')){var ac=t.closest('.rd-autocomplete');if(ac){var wasOpen=ac.classList.contains('open');closeFilterPops();if(!wasOpen){ac.classList.add('open');t.setAttribute('aria-expanded','true');if(mobileHistoryEnabled())pushMobileHistory('autocomplete')}}return}
if(t.hasAttribute('data-select-open')){var sb=t.closest('.rd-selectbox');if(sb){var wasOpenSelect=sb.classList.contains('open');closeFilterPops();if(!wasOpenSelect){sb.classList.add('open');t.setAttribute('aria-expanded','true');if(mobileHistoryEnabled()){pushMobileHistory('select');if(sb.getAttribute('data-selectbox')==='fuel')scrollMobileToTarget(sb)}}}return}
if(t.hasAttribute('data-price-code')){var pk=t.getAttribute('data-key'),pv2=t.getAttribute('data-price-code');state[pk]=pv2;state.page=1;catalog.hasMore=true;saveSavedFilters();renderSidebar();await loadListings();return}
if(t.hasAttribute('data-select-code')){var k=t.getAttribute('data-key'),v=t.getAttribute('data-select-code');state[k]=v;state.page=1;catalog.hasMore=true;saveSavedFilters();renderSidebar();await loadListings();return}
if(t.hasAttribute('data-multi-code')){var mk=t.getAttribute('data-key'),mv=t.getAttribute('data-multi-code'),arr=state[mk]||[],ii=arr.indexOf(mv);if(ii>=0)arr.splice(ii,1);else arr.push(mv);state.page=1;catalog.hasMore=true;saveSavedFilters();renderSidebar();await loadListings();return}
if(t.hasAttribute('data-chip-code')){var ck=t.getAttribute('data-chip-key'),cv=t.getAttribute('data-chip-code'),ca=state[ck]||[],ci=ca.indexOf(cv);if(ci>=0)ca.splice(ci,1);else ca.push(cv);state.page=1;catalog.hasMore=true;saveSavedFilters();renderSidebar();await loadListings();return}
if(t.hasAttribute('data-clear')){state[t.getAttribute('data-clear')]='';saveSavedFilters();state.page=1;catalog.hasMore=true;renderSidebar();await loadListings();return}
if(t.hasAttribute('data-tag')){removeTag(t.getAttribute('data-tag'));return}
if(t.hasAttribute('data-sort-open')){var so=t.closest('.rd-sortbox');if(window.matchMedia('(max-width:1023px)').matches){var wasOpenSort=so&&so.classList.contains('open');if(wasOpenSort){so.classList.remove('open');t.setAttribute('aria-expanded','false')}else{closeFilterPops();if(so){so.classList.add('open');t.setAttribute('aria-expanded','true');var pop=so.querySelector('.rd-sort-pop');if(pop){requestAnimationFrame(function(){var r=t.getBoundingClientRect(),h=pop.offsetHeight,w=Math.min(320,window.innerWidth-32),top=r.bottom+6;if(top+h>window.innerHeight-16)top=Math.max(16,r.top-h-6);pop.style.left=Math.round((window.innerWidth-w)/2)+'px';pop.style.right='auto';pop.style.width=w+'px';pop.style.top=Math.round(top)+'px'})}}}}else{closeFilterPops();if(so){so.classList.add('open');t.setAttribute('aria-expanded','true')}}return}
if(t.hasAttribute('data-sort-code')){var parts=t.getAttribute('data-sort-code').split('|');state.sort=parts[0];state.order=parts[1];state.page=1;catalog.hasMore=true;renderSort();closeFilterPops();await loadListings();return}
if(t.hasAttribute('data-fav')){e.preventDefault();e.stopPropagation();toggleFav(t.getAttribute('data-fav'));return}
});
document.addEventListener('click',function(e){
var link=e.target.closest('a[href]');
if(link&&e.button===0&&!e.defaultPrevented&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey&&!e.altKey&&link.target!=='_blank'){
try{
var u=new URL(link.href,window.location.href),cp=(window.location.pathname||'/').replace(/\/$/,'')||'/',dp=new URL(CONFIG.CARD_URL_TEMPLATE.replace('{id}','0'),window.location.href).pathname.replace(/\/$/,'')||'/';
if(u.hostname===window.location.hostname)sessionStorage.setItem('rd-catalog-filter-context-v1',u.pathname.replace(/\/$/,'')===dp?'detail':(u.pathname.replace(/\/$/,'')===cp?'catalog':'other'));else sessionStorage.setItem('rd-catalog-filter-context-v1','other')
}catch(err){sessionStorage.setItem('rd-catalog-filter-context-v1','other')}
}
if(!e.target.closest('#rd-red-dragon-catalog .rd-autocomplete,#rd-red-dragon-catalog .rd-selectbox,#rd-red-dragon-catalog .rd-sortbox'))closeFilterPops();
if(!e.target.closest('#rd-red-dragon-catalog [data-info]'))hideInfo()
});
await loadRefsAndBrands();
renderSidebar();
bindMobilePopularSwipe();
await initialLoadListings();
bindMobilePopularSwipe()
}
window.RDRedDragonCatalog=window.RDRedDragonCatalog||{};
window.RDRedDragonCatalog.getFilters=function(){return JSON.parse(JSON.stringify(state))};
window.RDRedDragonCatalog.getFavorites=function(){return catalog.favorites.slice()};
window.RDRedDragonCatalog.getFavoriteCount=function(){return catalog.favorites.length};
window.RDRedDragonCatalog.isFavorite=function(id){return isFav(id)};
window.RDRedDragonCatalog.toggleFavorite=function(id){toggleFav(id);return isFav(id)};
window.RDRedDragonCatalog.setFilters=function(incoming){if(!incoming||typeof incoming!=='object')return;Object.keys(state).forEach(function(k){if(Object.prototype.hasOwnProperty.call(incoming,k))state[k]=incoming[k]});saveSavedFilters();catalog.countryApiKey=null;catalog.countryApiValue=null;state.page=1;catalog.hasMore=true;renderSidebar();loadListings()};
window.RDRedDragonCatalog.refresh=function(){state.page=1;catalog.hasMore=true;return loadListings()};
window.RDRedDragonCatalog.setView=setView;
setup();
})();
</script>
